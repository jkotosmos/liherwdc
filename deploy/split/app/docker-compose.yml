# Сервер приложения (за рубежом): сайт базы знаний, бот OPERON и HTTPS.
# Базы — на отдельном сервере в РФ, доступ к ним только через приватный
# канал WireGuard (../wireguard.sh): MongoDB и Qdrant на DB_HOST (10.8.0.1).
#
# Сайт и его API живут на ОДНОМ домене (KB_DOMAIN): /api → бэкенд, остальное →
# фронтенд. Так не нужна правка CORS в коде бэкенда (там зашит адрес Amvera).
#
# Доступы к базам — по минимуму: сайт под operon_app (чтение и запись),
# бот под operon_bot (только чтение) и с ключом Qdrant только на чтение.
services:
  backend:
    build: ./src/ai-knowledge-base-backend
    restart: unless-stopped
    env_file: backend.env
    environment:
      PORT: "3000"
      NODE_ENV: production
      MONGODB_URI: mongodb://operon_app:${MONGO_APP_PASSWORD:?задайте MONGO_APP_PASSWORD в .env}@${DB_HOST:-10.8.0.1}:27017/operon
      QDRANT_URL: http://${DB_HOST:-10.8.0.1}:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?задайте QDRANT_API_KEY в .env}
      MAIN_DOMAIN: ${KB_DOMAIN}
      # Новый AWS SDK вшивает в подписанные ссылки контрольную сумму пустого
      # тела — Yandex S3 отклоняет загрузку файла из браузера. Только по требованию.
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      RESET_PASSWORD_URL: https://${KB_DOMAIN}/reset-password

  frontend:
    build:
      context: ./src/ai-knowledge-base-frontend
      # Свой Dockerfile: в исходном адрес API зашит (Amvera), здесь — домен сайта.
      dockerfile_inline: |
        FROM node:20-alpine AS builder
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY . .
        ARG VITE_API_URL
        ENV VITE_API_URL=$${VITE_API_URL}
        RUN npm run build
        FROM node:20-alpine
        WORKDIR /app
        RUN npm install -g serve
        COPY --from=builder /app/dist ./dist
        EXPOSE 3000
        CMD ["serve", "-s", "dist", "-l", "3000"]
      args:
        VITE_API_URL: https://${KB_DOMAIN}
    restart: unless-stopped

  bot:
    build: ../../..
    restart: unless-stopped
    env_file: bot.env
    environment:
      OPERON_HOST: 0.0.0.0
      OPERON_PORT: "80"
      OPERON_PUBLIC_URL: https://${BOT_DOMAIN}
      QDRANT_URL: http://${DB_HOST:-10.8.0.1}:6333
      QDRANT_API_KEY: ${QDRANT_READ_KEY:?задайте QDRANT_READ_KEY в .env}
      # Роли пользователей и даты документов — из базы сайта, только чтение.
      OPERON_MONGODB_URI: mongodb://operon_bot:${MONGO_BOT_PASSWORD:?задайте MONGO_BOT_PASSWORD в .env}@${DB_HOST:-10.8.0.1}:27017/operon
    volumes:
      - ./data/bot:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      KB_DOMAIN: ${KB_DOMAIN:?задайте KB_DOMAIN в .env}
      BOT_DOMAIN: ${BOT_DOMAIN:?задайте BOT_DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      - backend
      - frontend
      - bot
